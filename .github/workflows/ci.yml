## A basic GitHub Actions workflow for your Quarkus application.

name: CI build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: 25
          distribution: temurin
          cache: maven

      - name: Check formatting
        run: ./mvnw -B spotless:apply

      - name: Check style
        run: ./mvnw -B checkstyle:check

      - name: Check test compile
        run: ./mvnw -B clean test-compile

      - name: Check bytecode
        run: ./mvnw -B compile spotbugs:check

      - name: Build
        run: ./mvnw clean verify -B
